spring.application.name=frota

# PostgreSQL (suba com: docker compose up -d)
spring.datasource.url=jdbc:postgresql://localhost:5432/frota
spring.datasource.username=admfrota
spring.datasource.password=123456

# Cria as tabelas (idempotente) ao iniciar
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Regras de negocio
# Quantos km antes da revisao o veiculo passa a aparecer como "PROXIMA"
frota.revisao.antecedencia-km=1000
